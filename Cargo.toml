[package]
name = "settings"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0"
description = "Xinux gtk/libadwaita settings app"
homepage = "https://github.com/xinux-org/settings"
repository = "https://github.com/xinux-org/settings"
authors = ["bemeritus", "ae5259"]
publish = false

[workspace]
members = [".", "s-helper"]
default-members = [".", "s-helper"]

# Optimize release binary as much as possible
[profile.release]
lto = true
opt-level = "z"

[profile.dev]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# GNOME deps
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
relm4 = { version = "0.10.0", features = ["libadwaita", "gnome_48", "macros"] }
relm4-components = { version = "0.10.0", features = ["libadwaita"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_8"] }
vte = { package = "vte4", version = "0.9" }
libgweather = "4.7"
pango = "0.21.5"
gnome-desktop = { package = "gnome-desktop-xinux", version = "0.21.5" } 

nix-data = "0.0.3"
nixpkgs-fmt = "1.3"
nix-editor = "0.3.0"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
tracker = "0.2.2"
thiserror = "1"
anyhow = "1.0.102"
walkdir = "2.3"
serde = { version = "1.0.228", features = ["derive"] }

# appearance page
enquote = "1"

# system infos
sysinfo = "0.38.3"
wgpu = "27.0.1"
dconf_rs = "0.3.0"

# power page
ppd = "0.1.0"
zbus = { version = "5.13", default-features = false }
notify = { version = "8.1.0", features = ["serde"] }
regex = "1.12.3"
nmrs = "2.0.1"
